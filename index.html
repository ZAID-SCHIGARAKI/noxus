<!doctype html>
<html lang="de">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0b1020" />
    <meta name="description" content="Deine persönlichen Mini-Apps für Schule, Lernen und Alltag." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Mini Studio" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <title>Zaid Mini Studio</title>
    <style>
      .boot-fallback {
        box-sizing: border-box;
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 10px;
        padding: 32px;
        background: #f2f5fb;
        color: #101828;
        font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", sans-serif;
        text-align: center;
      }
      .boot-fallback h1 { margin: 0; font-size: 24px; }
      .boot-fallback p { margin: 0; color: #667085; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback" id="boot-fallback">
        <h1>Noxus wird gestartet …</h1>
        <p>Die App wird für dein Gerät vorbereitet.</p>
      </main>
    </div>
    <script>
      (function () {
        function showStartError() {
          var fallback = document.getElementById("boot-fallback");
          if (!fallback) return;
          fallback.innerHTML = "<h1>Noxus konnte nicht starten</h1><p>Bitte aktualisiere iOS und lade diese Seite erneut.</p>";
        }
        window.setTimeout(showStartError, 8000);
        window.addEventListener("error", showStartError);
        window.addEventListener("unhandledrejection", showStartError);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
